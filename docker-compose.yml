services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - devboard-network


  # =========================
  # Go Backend
  # =========================
  backend:
    image: ${BACKEND_IMAGE:-devboard-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"

    environment:
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL must be set}
      PORT: ${BACKEND_PORT:-8080}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    networks:
      - devboard-network


  # =========================
  # React Frontend + Nginx
  # =========================
  frontend:
    image: ${FRONTEND_IMAGE:-devboard-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:8080"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

    networks:
      - devboard-network


# =========================
# Volumes
# =========================
volumes:
  postgres_data:


# =========================
# Network
# =========================
networks:
  devboard-network:
    driver: bridge
