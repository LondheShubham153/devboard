# SonarCloud. Adjust projectKey/organization to match your SonarCloud project
# (shown in the SonarCloud UI after you import the repo; org key is lowercase).
sonar.projectKey=LondheShubham153_devboard
sonar.organization=londheshubham153
sonar.projectName=devboard

sonar.sources=backend,frontend,ai-service
# Reviewed false positives and accepted risks. Each is narrowed to one rule on
# one path so the rest of the code is still scanned. Terraform, Ansible and the
# workflows are also covered by Checkov, Trivy and tflint in CI.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9

# updateTask builds SQL from a whitelist of column names; values are parameterized.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/main.go

# JSON API with no cookies or sessions, so there is nothing for CSRF to ride on.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e2.resourceKey=ai-service/app/main.py

# Standard modes (0644/0755) on downloaded installers and binaries.
sonar.issue.ignore.multicriteria.e3.ruleKey=ansible:S2612
sonar.issue.ignore.multicriteria.e3.resourceKey=ansible/**

# Local http:// URLs printed for the user, and the in-cluster dev proxy target.
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=frontend/vite.config.js

# Terraform state bucket: access logging needs a separate log bucket (design choice).
sonar.issue.ignore.multicriteria.e6.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e6.resourceKey=terraform/bootstrap/**

# Teaching-cluster Grafana login, not a real credential.
sonar.issue.ignore.multicriteria.e7.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.e7.resourceKey=gitops/observability/grafana-values.yaml

# Lock-file rules: versions are pinned, hash-locking is not set up for this repo.
sonar.issue.ignore.multicriteria.e8.ruleKey=githubactions:S85*
sonar.issue.ignore.multicriteria.e8.resourceKey=.github/workflows/**

sonar.issue.ignore.multicriteria.e9.ruleKey=docker:S8544
sonar.issue.ignore.multicriteria.e9.resourceKey=ai-service/Dockerfile

# NOTE: these ignores apply to the CI scanner (sonar-scan.yml). SonarCloud's
# automatic analysis (the "SonarCloud Code Analysis" PR check) ignores this file;
# mirror the same rules in SonarCloud > Administration > General Settings >
# Analysis Scope > Ignore Issues on Multiple Criteria.
