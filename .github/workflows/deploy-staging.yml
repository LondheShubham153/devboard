name: CD - Staging, Smoke, E2E, and DAST

on:
  workflow_call:
    inputs:
      frontend_image: {required: true, type: string}
      backend_image: {required: true, type: string}
      release_version: {required: true, type: string}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy and validate staging
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: |
          COMPOSE_FILE=docker-compose.production.yml \
          ENVIRONMENT=staging RELEASE_VERSION="${{ inputs.release_version }}" \
          FRONTEND_IMAGE="${{ inputs.frontend_image }}" \
          BACKEND_IMAGE="${{ inputs.backend_image }}" bash scripts/deploy-compose.sh
      - run: |
          test -n "$STAGING_URL"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$STAGING_URL/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$STAGING_URL/" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$STAGING_URL/api/projects" >/dev/null
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
      - name: Collect staging container diagnostics
        if: failure()
        run: |
          docker compose \
            --env-file /etc/devboard/staging.env \
            -f docker-compose.production.yml ps
          docker compose \
            --env-file /etc/devboard/staging.env \
            -f docker-compose.production.yml logs --no-color --tail=100 frontend backend || true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Execute critical E2E journeys when configured
        run: npm ci --legacy-peer-deps && npm run e2e --if-present
        working-directory: frontend
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
