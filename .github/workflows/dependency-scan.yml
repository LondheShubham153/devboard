name: Dependency scan

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Make reports dir
              run: mkdir -p reports

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version-file: backend/go.mod
                cache-dependency-path: backend/go.sum

            - name: Govulncheck
              continue-on-error: true
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
                (cd backend && govulncheck ./...) | tee reports/backend-govulncheck.txt

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: npm audit
              continue-on-error: true
              run: (cd frontend && npm audit) | tee reports/frontend-npm-audit.txt

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'

            - name: pip-audit
              continue-on-error: true
              run: |
                pip install --require-hashes --only-binary :all: -r ai-service/requirements-dev.lock
                pip-audit --require-hashes -r ai-service/requirements.lock | tee reports/ai-pip-audit.txt

            - name: Upload Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report
                path: reports/
                retention-days: 5
