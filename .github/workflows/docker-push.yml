name: Docker Push

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable tag to push (e.g. sha-abc1234)
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest        # amd64 — matches the EKS nodes
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend', 'frontend', 'ai-service']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hardened Images [Login]
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folders }}
          push: true
          # Only the frontend Dockerfile declares these; the others ignore them.
          build-args: |
            VITE_OTEL_ENABLED=true
            VITE_OTEL_ENVIRONMENT=prod
            VITE_APP_VERSION=${{ inputs.image_tag }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:${{ inputs.image_tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
