# This file for push the code to dockerhub
name: CI
on: 
    push: 
        branches: master

jobs:
    push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: login into docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # Tag and push the existing image
            # Replace 'your-existing-local-tag' and 'your-hub-repo'
            - name: Tag and Push to Docker Hub
              run: |
                docker tag your-existing-local-tag ${{ secrets.DOCKERHUB_USERNAME }}/your-hub-repo:latest
                docker tag your-existing-local-tag ${{ secrets.DOCKERHUB_USERNAME }}/your-hub-repo:${{ github.sha }}
                
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-hub-repo:latest
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/your-hub-repo:${{ github.sha }}
