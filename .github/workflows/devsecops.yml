name: DevSecOps

on:
  push:
    branches:
      - master
      - feat/dora-sota

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:

  # ---------------- CI ----------------

  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml

  dependency-checks:
    uses: ./.github/workflows/dependency-scan.yml

  docker-checks:
    uses: ./.github/workflows/docker-scans.yml

  sonar-qube:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit

  code-tests:
    uses: ./.github/workflows/code-tests.yml

  # -------- Container Release --------

  docker-build-scan-push:
    uses: ./.github/workflows/docker-push.yml
    needs:
      - code-quality
      - code-tests
      - sonar-qube
      - docker-checks
      - dependency-checks
      - secret-scanning
    secrets: inherit

  # ---------------- CD ----------------
  #
  # Direct deployment is intentionally disabled.
  #
  # GitHub Actions will later update the GitOps
  # manifests and Argo CD will deploy them.
  #