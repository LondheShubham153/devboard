name: Code Quality
on:
    workflow_call:

jobs:
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'
            
            - name: Install npm dependencies
              run: npm install
              working-directory: frontend
            
            - name: Run ESLint
              run: npm run lint

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.23'
            
            - name: Run fmt
              run: go fmt ./...

            - name: Run vet
              run: go vet ./...