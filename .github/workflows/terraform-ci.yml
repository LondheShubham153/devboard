# No AWS creds on purpose: linting does not need state, and state holds cluster secrets.
name: Terraform Checks

on:
  push:
    branches: [mega-project]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt-validate:
    name: Format and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ['terraform', 'terraform/bootstrap']
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}

      - name: terraform init
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - run: tflint --init
        working-directory: terraform

      - run: tflint --recursive --format compact
        working-directory: terraform

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli
          download_external_modules: false

  trivy-config:
    name: Trivy (IaC misconfiguration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
