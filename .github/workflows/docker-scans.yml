name: Docker Scan

on: 
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders: ['backend','frontend','ai-service']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: ${{ matrix.folders}} Dockerfile Lint
              uses: hadolint/hadolint-action@v3.5.0
              with:
                dockerfile: ${{ matrix.folders}}/Dockerfile
              
            - name: Docker Hardened Images [Login]
              uses: docker/login-action@v4
              with:
                registry: dhi.io
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build ${{ matrix.folders}}
              run: docker build -t devboard-${{ matrix.folders }}:ci .
              working-directory: ${{ matrix.folders}}

            # Make the auto-detected instrumentation set reviewable: bootstrap resolves
            # packages at build time, so record what this build actually contains.
            - name: Record OpenTelemetry bootstrap set
              if: matrix.folders == 'ai-service'
              run: |
                mkdir -p reports
                docker run --rm --entrypoint opentelemetry-bootstrap devboard-${{ matrix.folders }}:ci -a requirements > reports/otel-bootstrap-requirements.txt
                cat reports/otel-bootstrap-requirements.txt

            - name: Upload OpenTelemetry bootstrap set
              if: matrix.folders == 'ai-service'
              uses: actions/upload-artifact@v7
              with:
                name: otel-bootstrap-requirements
                path: reports/otel-bootstrap-requirements.txt

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              continue-on-error: true
              with:
                image-ref: devboard-${{ matrix.folders }}:ci
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'
             
