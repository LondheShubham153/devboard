# Goal to deploy the build images from ci steps one CI workflow is succeeded

name: CD

on:
  workflow_call:


jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy Example Env File to main ENV File
        run: cp .env.example .env

      - name: Docker Setup Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy the container with docker-compose
        run: |
          docker-compose  pull 
          docker-compose up -d
