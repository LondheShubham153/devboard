# cert-manager. Wave 0, next to External Secrets: both are operators with CRDs.
# It checks for the Gateway API CRDs only at STARTUP - boot it before Envoy
# Gateway and every Certificate sits Pending. Fix: rollout restart deploy cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.21.1"
    helm:
      valuesObject:
        crds:
          enabled: true
          keep: true

        # Renders --enable-gateway-api. The old ExperimentalGatewayAPISupport gate is obsolete.
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          gatewayAPI:
            enabled: true

        # Public resolvers for the HTTP-01 self-check; CoreDNS caches a stale answer.
        extraArgs:
          - --acme-http01-solver-nameservers=8.8.8.8:53,1.1.1.1:53

        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        cainjector:
          resources:
            requests:
              cpu: 10m
              memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply: cert-manager's CRDs exceed the 262144-byte last-applied-configuration limit.
      - ServerSideApply=true
