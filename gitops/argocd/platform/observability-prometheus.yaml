# Prometheus, the Prometheus Operator, kube-state-metrics and node-exporter.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "88.2.0"
      helm:
        valueFiles:
          - $values/gitops/observability/prometheus-values.yaml

    - repoURL: https://github.com/LondheShubham153/devboard.git
      targetRevision: mega-project
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
