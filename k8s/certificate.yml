# Lives in devboard because a Gateway listener can only reference a Secret in its
# own namespace. Start on staging, confirm Ready, then switch to prod - in GIT,
# since selfHeal reverts kubectl patch.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devboard-tls
  namespace: devboard
spec:
  secretName: devboard-tls
  dnsNames:
    - devboard.trainwithshubham.com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  # Let's Encrypt certs last 90 days; renew 30 days out.
  renewBefore: 720h
