# ---------------------------------------------------------------------------
# RBAC RoleBinding — DevBoard Application
# Binds the devboard-app-role to both service accounts.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devboard-app-rolebinding
  namespace: devboard-prod
  labels:
    app.kubernetes.io/part-of: devboard
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devboard-app-role
subjects:
  - kind: ServiceAccount
    name: devboard-backend
    namespace: devboard-prod
  - kind: ServiceAccount
    name: devboard-frontend
    namespace: devboard-prod

