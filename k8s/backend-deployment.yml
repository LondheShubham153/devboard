apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-backend-deployment
  namespace: devboard
  labels:
    app: devboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        app: devboard-backend
    spec:
      containers:
      - name: devboard-backend
        image: trainwithshubham/devboard-backend:sha-4945e5b
        ports:
          - containerPort: 8080
        env:
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_USER
          
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_PASSWORD

          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_DB

          - name: POSTGRES_URL
            value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          
          - name: PORT
            value: "8080"

          - name: OTEL_SERVICE_NAME
            value: backend
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector-gateway.observability.svc.cluster.local:4317
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: deployment.environment=raw,service.namespace=devboard
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi   # GitOps demo: bumped from 128Mi via a Git change

