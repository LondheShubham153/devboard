apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devboard-gateway
  namespace: devboard
spec:
  gatewayClassName: envoy
  listeners:
    # Port 80 carries the ACME challenge and the redirect. No hostname, so the
    # raw load balancer URL keeps working.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    # Needs the devboard-tls Secret. Without it this listener alone goes
    # ResolvedRefs=False; :80 keeps serving.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: devboard.trainwithshubham.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: devboard-tls
      allowedRoutes:
        namespaces:
          from: Same
