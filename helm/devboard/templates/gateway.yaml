{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "devboard.fullname" . }}-gateway
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      {{- if and .Values.gateway.hostname (not .Values.gateway.tls.enabled) }}
      hostname: {{ .Values.gateway.hostname | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if and .Values.gateway.tls.enabled .Values.gateway.hostname }}
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port }}
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: {{ .Values.gateway.tls.secretName | default (printf "%s-tls" (include "devboard.fullname" .)) }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
