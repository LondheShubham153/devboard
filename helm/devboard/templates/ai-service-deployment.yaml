{{- if .Values.ai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devboard.fullname" . }}-ai-service
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    app: devboard-ai-service
spec:
  replicas: {{ .Values.ai.replicas }}
  selector:
    matchLabels:
      app: devboard-ai-service
  template:
    metadata:
      labels:
        {{- include "devboard.labels" . | nindent 8 }}
        app: devboard-ai-service
    spec:
      # No pod here calls the Kubernetes API, so do not hand it a token.
      automountServiceAccountToken: false
      containers:
        - name: devboard-ai-service
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ai.port }}
          env:
            - name: PORT
              value: {{ .Values.ai.port | quote }}
            - name: TASK_SERVICE_URL
              value: {{ .Values.ai.taskServiceUrl | quote }}
            - name: MODEL_API_BASE
              value: {{ .Values.ai.ollamaUrl | quote }}
            - name: MODEL_NAME
              value: {{ .Values.ai.modelName | quote }}
            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: ai-service
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpHttpEndpoint | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=helm,service.namespace={{ .Release.Namespace }}"
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: health,metrics
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ai.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ai.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
{{- end }}
