{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "devboard.fullname" . }}-route
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "devboard.fullname" . }}-gateway
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    # Exact matches, not PathPrefix — see k8s/httproute.yml for the incident this prevents.
    {{- if .Values.ai.enabled }}
    {{- range $ep := list "summarise" "ask" }}
    - matches:
        - path:
            type: Exact
            value: /api/ai/{{ $ep }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /{{ $ep }}
      timeouts:
        request: "300s"
        backendRequest: "300s"
      backendRefs:
        - name: {{ $.Values.ai.serviceName }}
          port: {{ $.Values.ai.port }}
    {{- end }}
    - matches:
        - path:
            type: Exact
            value: /api/ai/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: {{ .Values.ai.serviceName }}
          port: {{ .Values.ai.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devboard-frontend-service
          port: {{ .Values.frontend.servicePort }}
{{- end }}
