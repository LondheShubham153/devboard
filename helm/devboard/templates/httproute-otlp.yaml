{{- if and .Values.gateway.enabled .Values.observability.enabled .Values.observability.browserTracing }}
# Browser spans. A separate route so the rate limit can target just this route.
# Needs the ReferenceGrant in gitops/observability/manifests/otlp-ingest.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "devboard.fullname" . }}-otlp-route
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "devboard.fullname" . }}-gateway
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /otlp/v1/traces
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/traces
      backendRefs:
        - name: {{ .Values.observability.collectorService }}
          namespace: {{ .Values.observability.collectorNamespace }}
          port: {{ .Values.observability.browserPort }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "devboard.fullname" . }}-otlp-limit
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "devboard.fullname" . }}-otlp-route
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: {{ .Values.observability.browserRateLimitPerMinute }}
            unit: Minute
{{- end }}
