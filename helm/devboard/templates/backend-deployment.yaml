apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devboard.fullname" . }}-backend
  labels:
    {{- include "devboard.labels" . | nindent 4 }}
    app: devboard-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        {{- include "devboard.labels" . | nindent 8 }}
        app: devboard-backend
    spec:
      # No pod here calls the Kubernetes API, so do not hand it a token.
      automountServiceAccountToken: false
      containers:
        - name: devboard-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: devboard-secrets
                  key: POSTGRES_URL
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            {{- if .Values.observability.enabled }}
            - name: OTEL_SERVICE_NAME
              value: backend
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpGrpcEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=helm,service.namespace={{ .Release.Namespace }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
