nameOverride: ""
fullnameOverride: ""

postgres:
  image: postgres:16-alpine
  user: devboard
  password: devboard
  db: devboard
  serviceName: postgres
  storage:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  image:
    repository: trainwithshubham/devboard-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  serviceName: backend
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

frontend:
  image:
    repository: trainwithshubham/devboard-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 4173
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
