# Local stand-in for the Envoy Gateway used on EKS (see k8s/httproute.yml).
# Same routes: three exact /api/ai/* paths go to ai-service, everything else
# goes to the frontend, which forwards /api to the Go backend.
server {
    listen 80;

    # Docker's embedded DNS. Resolving at request time lets nginx start even
    # when the optional ai-service container is not running.
    resolver 127.0.0.11 valid=10s;

    location = /api/ai/summarise { set $ai http://ai-service:3005; rewrite ^ /summarise break; proxy_pass $ai; include /etc/nginx/ai-proxy.conf; }
    location = /api/ai/ask       { set $ai http://ai-service:3005; rewrite ^ /ask break;       proxy_pass $ai; include /etc/nginx/ai-proxy.conf; }
    location = /api/ai/health    { set $ai http://ai-service:3005; rewrite ^ /health break;    proxy_pass $ai; include /etc/nginx/ai-proxy.conf; }

    location / {
        set $fe http://frontend:4173;
        proxy_pass $fe;
        proxy_set_header Host $host;
    }
}
